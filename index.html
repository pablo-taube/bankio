<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanças Pessoais — Cupertino Glass</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase JS & Vue 3 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: linear-gradient(135deg, #E9ECEF 0%, #F4F6F9 50%, #E3E8EE 100%);
      min-height: 100vh;
      color: #2D3748;
    }

    /* Styling Glassmorphism Estilo Cupertino */
    .glass-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.04);
    }

    .glass-sidebar {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.4);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(209, 213, 219, 0.5);
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.8);
      border-color: #2E6F68;
      outline: none;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
  </style>
</head>
<body>
  <div id="app" class="flex h-screen overflow-hidden">
    
    <!-- Tela de Login -->
    <div v-if="!session" class="flex-1 flex items-center justify-center p-4">
      <div class="glass-card p-8 max-w-md w-full">
        <div class="text-center mb-6">
          <div class="w-12 h-12 bg-[#2E6F68] text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-md">
            <i data-lucide="wallet"></i>
          </div>
          <h2 class="text-2xl font-semibold text-gray-800">Finanças Pessoais</h2>
          <p class="text-sm text-gray-500 mt-1">Digite suas credenciais para acessar</p>
        </div>

        <form @submit.prevent="handleLogin" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">E-mail</label>
            <input v-model="loginEmail" type="email" required class="w-full px-4 py-2.5 rounded-xl glass-input text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Senha</label>
            <input v-model="loginPassword" type="password" required class="w-full px-4 py-2.5 rounded-xl glass-input text-sm">
          </div>
          <button type="submit" :disabled="loading" class="w-full py-3 bg-[#2E6F68] hover:bg-[#245752] text-white font-medium rounded-xl shadow-sm transition duration-200 text-sm">
            {{ loading ? 'Entrando...' : 'Acessar Conta' }}
          </button>
        </form>
      </div>
    </div>

    <!-- Aplicação Principal -->
    <template v-else>
      <!-- Sidebar -->
      <aside class="w-64 glass-sidebar p-6 flex flex-col justify-between hidden md:flex">
        <div>
          <div class="flex items-center gap-3 mb-8">
            <div class="w-9 h-9 bg-[#2E6F68] text-white rounded-xl flex items-center justify-center shadow-sm">
              <i data-lucide="wallet" class="w-5 h-5"></i>
            </div>
            <span class="font-semibold text-lg text-gray-800">Bankio</span>
          </div>

          <div class="text-xs font-semibold text-gray-400 tracking-wider mb-3 px-2">MAIN MENU</div>
          <nav class="space-y-1">
            <button @click="currentTab = 'dashboard'" :class="{'bg-[#2E6F68] text-white shadow-sm': currentTab === 'dashboard', 'text-gray-600 hover:bg-white/40': currentTab !== 'dashboard'}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
            </button>
            <button @click="currentTab = 'transactions'" :class="{'bg-[#2E6F68] text-white shadow-sm': currentTab === 'transactions', 'text-gray-600 hover:bg-white/40': currentTab !== 'transactions'}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
              <i data-lucide="arrow-left-right" class="w-4 h-4"></i> Transações
            </button>
            <button @click="currentTab = 'installments'" :class="{'bg-[#2E6F68] text-white shadow-sm': currentTab === 'installments', 'text-gray-600 hover:bg-white/40': currentTab !== 'installments'}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
              <i data-lucide="credit-card" class="w-4 h-4"></i> Parcelados
            </button>
            <button @click="currentTab = 'planner'" :class="{'bg-[#2E6F68] text-white shadow-sm': currentTab === 'planner', 'text-gray-600 hover:bg-white/40': currentTab !== 'planner'}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
              <i data-lucide="calendar-check" class="w-4 h-4"></i> Projeção & Check
            </button>
          </nav>
        </div>

        <button @click="handleLogout" class="flex items-center gap-2 text-sm text-red-600 font-medium px-3 py-2 rounded-xl hover:bg-red-50/50 transition">
          <i data-lucide="log-out" class="w-4 h-4"></i> Sair da Conta
        </button>
      </aside>

      <!-- Conteúdo Principal -->
      <main class="flex-1 flex flex-col h-screen overflow-y-auto custom-scrollbar p-6">
        
        <!-- Topbar -->
        <header class="flex justify-between items-center mb-6">
          <div>
            <h1 class="text-xl font-semibold text-gray-800">Bem-vindo de volta!</h1>
            <p class="text-xs text-gray-500">Gerencie suas finanças em tempo real</p>
          </div>
          <div class="flex items-center gap-3">
            <button @click="hideValues = !hideValues" class="p-2 rounded-xl glass-card text-gray-600 hover:bg-white transition">
              <i :data-lucide="hideValues ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
            </button>
            <button @click="openModal = true" class="bg-[#2E6F68] text-white text-xs font-medium px-4 py-2.5 rounded-xl flex items-center gap-2 shadow-sm hover:bg-[#245752] transition">
              <i data-lucide="plus" class="w-4 h-4"></i> Nova Transação
            </button>
          </div>
        </header>

        <!-- DASHBOARD TAB -->
        <div v-if="currentTab === 'dashboard'" class="space-y-6">
          <!-- Cards Resumo -->
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="glass-card p-5">
              <span class="text-xs text-gray-500 font-medium">Total Receitas</span>
              <div class="text-xl font-bold text-emerald-700 mt-1">
                {{ hideValues ? '••••••' : formatCurrency(metrics.income) }}
              </div>
            </div>
            <div class="glass-card p-5">
              <span class="text-xs text-gray-500 font-medium">Total Despesas</span>
              <div class="text-xl font-bold text-rose-600 mt-1">
                {{ hideValues ? '••••••' : formatCurrency(metrics.expenses) }}
              </div>
            </div>
            <div class="glass-card p-5">
              <span class="text-xs text-gray-500 font-medium">Saldo Atual</span>
              <div class="text-xl font-bold text-gray-800 mt-1">
                {{ hideValues ? '••••••' : formatCurrency(metrics.balance) }}
              </div>
            </div>
            <div class="glass-card p-5 bg-[#2E6F68] text-white">
              <span class="text-xs text-emerald-200 font-medium">Taxa de Poupança</span>
              <div class="text-xl font-bold mt-1">{{ metrics.savingsRate }}%</div>
            </div>
          </div>

          <!-- Gráficos -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-card p-5 md:col-span-1 flex flex-col items-center">
              <h3 class="text-sm font-semibold text-gray-700 w-full mb-4">Despesas por Categoria</h3>
              <div class="w-48 h-48">
                <canvas id="categoryChart"></canvas>
              </div>
            </div>
            <div class="glass-card p-5 md:col-span-2">
              <h3 class="text-sm font-semibold text-gray-700 mb-4">Fluxo Financeiro Mensal</h3>
              <div class="h-48">
                <canvas id="monthlyChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- TRANSAÇÕES TAB -->
        <div v-if="currentTab === 'transactions'" class="glass-card p-6">
          <div class="flex justify-between items-center mb-4 gap-4 flex-wrap">
            <h3 class="font-semibold text-gray-800">Histórico de Transações</h3>
            <div class="flex gap-2">
              <input v-model="filterSearch" placeholder="Buscar..." class="px-3 py-1.5 rounded-lg glass-input text-xs">
              <select v-model="filterType" class="px-3 py-1.5 rounded-lg glass-input text-xs">
                <option value="all">Todos os tipos</option>
                <option value="income">Receitas</option>
                <option value="expense">Despesas</option>
              </select>
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-gray-600">
              <thead class="bg-black/5 text-gray-500">
                <tr>
                  <th class="p-3 rounded-l-lg">Data</th>
                  <th class="p-3">Descrição</th>
                  <th class="p-3">Categoria</th>
                  <th class="p-3">Valor</th>
                  <th class="p-3">Status</th>
                  <th class="p-3 rounded-r-lg">Ação</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">
                <tr v-for="t in filteredTransactions" :key="t.id" class="hover:bg-white/40">
                  <td class="p-3">{{ t.date }}</td>
                  <td class="p-3 font-medium text-gray-800">{{ t.description }}</td>
                  <td class="p-3"><span class="px-2 py-1 rounded-full text-[10px] font-medium" :style="{ backgroundColor: t.categories?.color + '20', color: t.categories?.color }">{{ t.categories?.name }}</span></td>
                  <td class="p-3 font-semibold" :class="t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'">
                    {{ t.type === 'income' ? '+' : '-' }} {{ formatCurrency(t.amount) }}
                  </td>
                  <td class="p-3">
                    <button @click="togglePaidStatus(t)" :class="t.is_paid ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'" class="px-2 py-0.5 rounded-full text-[10px] font-medium">
                      {{ t.is_paid ? 'Pago' : 'Pendente' }}
                    </button>
                  </td>
                  <td class="p-3">
                    <button @click="deleteTransaction(t.id)" class="text-gray-400 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- PARCELADOS TAB -->
        <div v-if="currentTab === 'installments'" class="space-y-6">
          <div class="glass-card p-6">
            <h3 class="font-semibold text-gray-800 mb-4">Novo Gasto Parcelado</h3>
            <form @submit.prevent="saveInstallment" class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <input v-model="instForm.description" placeholder="Ex: iPhone 15" required class="px-4 py-2 rounded-xl glass-input text-xs">
              <input v-model.number="instForm.totalAmount" type="number" step="0.01" placeholder="Valor Total (R$)" required class="px-4 py-2 rounded-xl glass-input text-xs">
              <input v-model.number="instForm.count" type="number" placeholder="Nº de Parcelas" min="2" max="72" required class="px-4 py-2 rounded-xl glass-input text-xs">
              <select v-model="instForm.categoryId" required class="px-4 py-2 rounded-xl glass-input text-xs">
                <option value="" disabled>Selecione a Categoria</option>
                <option v-for="c in categories" :key="c.id" :value="c.id">{{ c.name }}</option>
              </select>
              <button type="submit" class="md:col-span-4 bg-[#2E6F68] text-white py-2.5 rounded-xl text-xs font-medium">Lançar Parcelamento</button>
            </form>
          </div>
        </div>

        <!-- PROJEÇÃO & CHECKLIST TAB -->
        <div v-if="currentTab === 'planner'" class="glass-card p-6">
          <h3 class="font-semibold text-gray-800 mb-4">Checklist & Contas Recorrentes do Mês</h3>
          <div class="space-y-3">
            <div v-for="t in pendingChecklist" :key="t.id" class="flex items-center justify-between p-3 rounded-xl bg-white/50 border border-white/60">
              <div class="flex items-center gap-3">
                <input type="checkbox" :checked="t.is_paid" @change="togglePaidStatus(t)" class="rounded text-[#2E6F68]">
                <span :class="{'line-through text-gray-400': t.is_paid}" class="text-sm font-medium text-gray-700">{{ t.description }}</span>
              </div>
              <span class="text-sm font-semibold text-gray-800">{{ formatCurrency(t.amount) }}</span>
            </div>
          </div>
        </div>

      </main>

      <!-- Modal Nova Transação -->
      <div v-if="openModal" class="fixed inset-0 bg-black/20 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-card p-6 max-w-md w-full">
          <h3 class="text-base font-semibold text-gray-800 mb-4">Nova Transação Simples</h3>
          <form @submit.prevent="saveTransaction" class="space-y-3">
            <input v-model="txForm.description" placeholder="Descrição" required class="w-full px-4 py-2 rounded-xl glass-input text-xs">
            <input v-model.number="txForm.amount" type="number" step="0.01" placeholder="Valor" required class="w-full px-4 py-2 rounded-xl glass-input text-xs">
            <select v-model="txForm.type" class="w-full px-4 py-2 rounded-xl glass-input text-xs">
              <option value="expense">Despesa</option>
              <option value="income">Receita</option>
            </select>
            <select v-model="txForm.category_id" required class="w-full px-4 py-2 rounded-xl glass-input text-xs">
              <option v-for="c in categories" :key="c.id" :value="c.id">{{ c.name }}</option>
            </select>
            <input v-model="txForm.date" type="date" required class="w-full px-4 py-2 rounded-xl glass-input text-xs">
            <div class="flex gap-2 pt-2">
              <button type="button" @click="openModal = false" class="flex-1 py-2 bg-gray-200 text-gray-700 rounded-xl text-xs">Cancelar</button>
              <button type="submit" class="flex-1 py-2 bg-[#2E6F68] text-white rounded-xl text-xs font-medium">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </template>
  </div>

  <script>
    // CREDENCIAIS SUPABASE (Substitua com suas chaves)
    const SUPABASE_URL = 'https://SUA_SUPABASE_URL.supabase.co';
    const SUPABASE_KEY = 'SUA_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const { createApp, ref, computed, onMounted, nextTick } = Vue;

    createApp({
      setup() {
        const session = ref(null);
        const loading = ref(false);
        const currentTab = ref('dashboard');
        const hideValues = ref(false);
        const openModal = ref(false);

        const loginEmail = ref('');
        const loginPassword = ref('');

        const transactions = ref([]);
        const categories = ref([]);

        const filterSearch = ref('');
        const filterType = ref('all');

        const txForm = ref({ description: '', amount: null, type: 'expense', category_id: '', date: new Date().toISOString().substr(0, 10) });
        const instForm = ref({ description: '', totalAmount: null, count: 12, categoryId: '' });

        // Autenticação
        const handleLogin = async () => {
          loading.value = true;
          const { data, error } = await supabase.auth.signInWithPassword({ email: loginEmail.value, password: loginPassword.value });
          if (error) alert(error.message);
          else session.value = data.session;
          loading.value = false;
        };

        const handleLogout = async () => {
          await supabase.auth.signOut();
          session.value = null;
        };

        // Carregar Dados
        const fetchData = async () => {
          const { data: catData } = await supabase.from('categories').select('*');
          categories.value = catData || [];

          const { data: txData } = await supabase.from('transactions').select('*, categories(*)').order('date', { ascending: false });
          transactions.value = txData || [];

          renderCharts();
        };

        // Salvar Transação Simples
        const saveTransaction = async () => {
          await supabase.from('transactions').insert([txForm.value]);
          openModal.value = false;
          txForm.value = { description: '', amount: null, type: 'expense', category_id: '', date: new Date().toISOString().substr(0, 10) };
          fetchData();
        };

        // Salvar Parcelamento Automatizado
        const saveInstallment = async () => {
          const installmentValue = instForm.value.totalAmount / instForm.value.count;
          const groupId = crypto.randomUUID();
          const records = [];
          
          let startDate = new Date();
          for (let i = 1; i <= instForm.value.count; i++) {
            records.push({
              description: `${instForm.value.description} (${i}/${instForm.value.count})`,
              amount: installmentValue,
              type: 'expense',
              category_id: instForm.value.categoryId,
              date: startDate.toISOString().substr(0, 10),
              installment_group_id: groupId,
              current_installment: i,
              total_installments: instForm.value.count
            });
            startDate.setMonth(startDate.getMonth() + 1);
          }
          await supabase.from('transactions').insert(records);
          alert('Parcelas geradas com sucesso!');
          fetchData();
        };

        const togglePaidStatus = async (t) => {
          await supabase.from('transactions').update({ is_paid: !t.is_paid }).eq('id', t.id);
          fetchData();
        };

        const deleteTransaction = async (id) => {
          await supabase.from('transactions').delete().eq('id', id);
          fetchData();
        };

        // Computados
        const metrics = computed(() => {
          const income = transactions.value.filter(t => t.type === 'income').reduce((acc, t) => acc + Number(t.amount), 0);
          const expenses = transactions.value.filter(t => t.type === 'expense').reduce((acc, t) => acc + Number(t.amount), 0);
          const balance = income - expenses;
          const savingsRate = income > 0 ? (((income - expenses) / income) * 100).toFixed(1) : 0;
          return { income, expenses, balance, savingsRate };
        });

        const filteredTransactions = computed(() => {
          return transactions.value.filter(t => {
            const matchesSearch = t.description.toLowerCase().includes(filterSearch.value.toLowerCase());
            const matchesType = filterType.value === 'all' || t.type === filterType.value;
            return matchesSearch && matchesType;
          });
        });

        const pendingChecklist = computed(() => transactions.value.filter(t => t.type === 'expense'));

        const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);

        // Gráficos via Chart.js
        const renderCharts = async () => {
          await nextTick();
          if (currentTab.value !== 'dashboard') return;

          // Chart Categorias
          const catCtx = document.getElementById('categoryChart')?.getContext('2d');
          if (catCtx) {
            new Chart(catCtx, {
              type: 'doughnut',
              data: {
                labels: categories.value.map(c => c.name),
                datasets: [{
                  data: categories.value.map(c => transactions.value.filter(t => t.category_id === c.id).reduce((a, b) => a + Number(b.amount), 0)),
                  backgroundColor: ['#2E6F68', '#D9822B', '#4A607A', '#9B51E0', '#E76F51']
                }]
              },
              options: { plugins: { legend: { display: false } }, cutout: '70%' }
            });
          }
        };

        onMounted(() => {
          supabase.auth.getSession().then(({ data }) => {
            session.value = data.session;
            if (session.value) fetchData();
          });
          lucide.createIcons();
        });

        return {
          session, loading, loginEmail, loginPassword, handleLogin, handleLogout,
          currentTab, hideValues, openModal, metrics, transactions, categories,
          filteredTransactions, pendingChecklist, filterSearch, filterType,
          txForm, instForm, saveTransaction, saveInstallment, togglePaidStatus, deleteTransaction, formatCurrency
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
